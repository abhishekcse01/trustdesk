# Runtime settings. Paths are relative to the repo root.
data_dir: data
raw_dir: data/raw
chroma_dir: data/chroma
collection: policies

chunking:
  target_tokens: 300     # approximate, words x 1.33
  overlap_tokens: 50
  min_tokens: 40         # merge smaller sections into the next one

embedding:
  model: BAAI/bge-small-en-v1.5   # fastembed, ONNX on CPU
  batch_size: 64

retrieval:
  top_k: 3
  mode: hybrid           # dense | hybrid (dense + BM25 fused with reciprocal rank fusion)
  rerank: true           # cross-encoder rerank of the candidate pool (phase 3 choice, see reports/phase3.md)
  candidates: 20         # pool size per retriever before fusion / reranking
  rrf_k: 60
  reranker_model: Xenova/ms-marco-MiniLM-L-6-v2   # ~90 MB ONNX, CPU

llm:
  # Model alias used by the single-chain answerer in phase 1.
  # "ollama/<tag>" calls the local Ollama server; anything else goes through LiteLLM.
  drafter: ollama/qwen3:4b
  ollama_url: http://localhost:11434
  temperature: 0.1
  num_ctx: 8192
  timeout_s: 600

eval:
  # Leave empty to choose from the key in .env. Gemini free tier: Flash-Lite for all three
  # (~500 requests/day); `trustdesk models` lists names your key can use. Anthropic: Sonnet
  # drafts references, Haiku judges. With OPENAI_API_KEY, set these to openai/<model> names.
  reference_model: ""
  judge_model: ""
  api_drafter: ""        # used by `trustdesk eval --mode api`
  reference_top_k: 4     # chunks the reference drafter reads (~1.5k input tokens per call)
  max_output_tokens: 400 # cap on every API reply
  judge_chunk_chars: 800 # judge sees each retrieved chunk cut to this length
  min_interval_s: 0      # 0 = automatic (4.5 s between Gemini calls = under 15/min)
  max_retries: 4         # on rate-limit / unavailable errors, backing off 5-40 s

graph:
  # Verifier abstains when the best question-passage evidence score is below this.
  # Chosen from `trustdesk calibrate` (13 Nov): 0.3 abstains on 68% of unanswerable questions
  # and 7.6% of answerable ones; 0.5 gave the same 68% but 10.6%. Re-run after verification.
  abstain_threshold: 0.3
  support_threshold: 0.3
  max_retries: 1
  retry_extra_k: 2
  checkpoint_db: data/checkpoints.sqlite
  audit_db: data/trustdesk.sqlite

tracing:
  service_name: trustdesk
  jsonl_dir: reports/traces   # git-ignored; set OTEL_EXPORTER_OTLP_ENDPOINT to also export

