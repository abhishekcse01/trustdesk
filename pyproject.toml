[project]
name = "trustdesk"
version = "0.1.0"
description = "Multi-agent assistant that drafts cited answers to security questionnaires from policy documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.0",
    "fastembed>=0.5",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "markdownify>=0.13",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# API models through LiteLLM (hybrid / api mode). Not needed for local-only runs.
api = ["litellm>=1.50"]

[project.scripts]
trustdesk = "trustdesk.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.uv]
# Windows Smart App Control blocks mypy's compiled (mypyc) DLL; the pure-Python build works.
no-binary-package = ["mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Typer reads defaults from these calls; that is the documented pattern.
"src/trustdesk/cli.py" = ["B008"]
# The Smart App Control shim must run before chromadb is imported.
"src/trustdesk/ingest/index.py" = ["E402"]
# Curly quotes are intentional: they normalise model quotes before matching.
"src/trustdesk/agents/answer.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trustdesk"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "fastembed.*", "markdownify.*", "bs4.*", "litellm.*", "grpc.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# LangSmith's auto-loaded plugin imports uuid_utils before trustdesk's Windows shim can run.
addopts = "-p no:langsmith_plugin"
pythonpath = ["src"]
