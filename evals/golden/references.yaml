- id: G047
  question: How are identified security risks tracked and treated?
  domain: GRC
  label: partial
  reference_answer: We track and treat identified security risks through various processes, such as discussing
    ad-hoc identified security risks with the Security Risk Team to assign an inherent risk score, performing
    qualitative analysis, and determining whether to escalate them to the risk register. Additionally,
    for validated security items, we ensure that a treatment plan or risk acceptance, a due date for follow-up
    or remediation testing, required labels, monitoring, and mapping to a related risk issue are in place.
  key_facts:
  - All security and technology operational risks identified ad-hoc are discussed with the Security Risk
    Team, assigned an inherent risk score, and analyzed to determine escalation to the risk register.
  - Security validates that a treatment plan or risk acceptance, remediation testing due date, required
    labels, monitoring, and mapping to a related risk issue are in place.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/security-assurance/security-risk/storm-program/
  - https://handbook.gitlab.com/handbook/security/security-observations-risk-management/
  supporting_quotes:
  - All security and technology operational risks identified ad-hoc are discussed with the Security Risk
    Team, an inherent risk score is assigned, and a qualitative analysis done to determine if it should
    be escalated to the risk register.
