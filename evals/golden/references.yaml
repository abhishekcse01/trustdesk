- id: G093
  question: How do you define what counts as a vulnerability?
  domain: TVM
  label: answerable
  reference_answer: We define a vulnerability as a flaw in either code or configuration with potential
    or demonstrated security impact. To be considered a vulnerability rather than just a bug, it must
    have a security impact that could cause software to behave in a way unexpected by a typical user,
    negatively impacting availability, integrity, or confidentiality. Additionally, a vulnerability does
    not need to be demonstrated as exploitable to be classified as one.
  key_facts:
  - A vulnerability is a flaw in either code or configuration with potential or demonstrated security
    impact.
  - It must have a security impact that negatively impacts availability, integrity, or confidentiality,
    or causes unexpected software behavior.
  - A vulnerability does not need to be demonstrated to be exploitable to be considered a vulnerability.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/product-security/vulnerability-management/what-is-a-vulnerability/
  supporting_quotes:
  - A vulnerability describes a flaw in either code or configuration with potential or demonstrated security
    impact.
  - Security impact is classified by the potential to cause software to behave in a way which would be
    considered unexpected by a typical user of the software or system, negatively impacting the availability
    or integrity of the software, or the confidentiality of information held or processed by the system.
  - A vulnerability does not need to be demonstrated to be exploitable to be considered a vulnerability
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
