- id: G026
  question: Which TLS versions do you allow for data in transit?
  domain: CEK
  label: answerable
  reference_answer: We require TLS 1.3 to be enabled and preferred in all new deployments. We allow TLS
    1.2 to remain enabled for legacy interoperability, provided it is not the only supported version.
    We do not allow TLS 1.0 and 1.1.
  key_facts:
  - TLS 1.3 must be enabled and preferred in all new deployments.
  - TLS 1.2 may remain enabled for legacy interoperability but must not be the only supported TLS version.
  - TLS 1.0 and 1.1 are not allowed.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/policies_and_standards/cryptographic-standard/
  supporting_quotes:
  - TLS 1.3 must be enabled and preferred in all new deployments.
  - TLS 1.2 MAY remain enabled for legacy interoperability but MUST NOT be the only supported TLS version.
  - TLS 1.0 and 1.1 are not allowed, despite being FIPS 140-2 compliant.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
