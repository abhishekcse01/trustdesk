- id: G030
  question: How are API tokens and access tokens managed and expired?
  domain: CEK
  label: partial
  reference_answer: We manage personal access tokens by setting their expiration date for a maximum of
    365 days in the future, while legacy PATs default to expiring in 30 days. When creating or rotating
    tokens, we configure their permissions and ensure that we revoke or deactivate old tokens. Additionally,
    we ensure that the lifecycle of a token, including creation, attributes, usage, and deletion, is logged
    for auditing purposes while keeping the token value masked.
  key_facts:
  - For fine-grained PATs or gPATs, the maximum expiration is set for 365 days in the future.
  - Legacy PATs default to expire in 30 days.
  - The lifecycle of a token must be logged for auditing purposes.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/product-security/security-platforms-architecture/product-security-engineering/runbooks/rotate-service-account-personal-access-tokens/
  - https://handbook.gitlab.com/handbook/security/policies_and_standards/token-management-standard/
  supporting_quotes:
  - For `Expiration Date` set it for 365 days in the future (the maximum expiration). If you do not set
    it, it is default to expire in 30 days for legacy PATs (gPATs default to 365).
  - The lifecycle of a token (creation, attributes, usage, and deletion) must be logged for auditing purposes.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
