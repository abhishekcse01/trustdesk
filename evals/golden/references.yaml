references:
- id: G001
  question: Are your security controls tested by an internal team on a regular schedule?
  domain: AA
  label: answerable
  reference_answer: Yes, we test our security controls on a regular schedule using the Compliance team.
    Compliance controls required for external certifications are tested at least annually, and risk-based
    controls are tested by Security-Compliance on a quarterly basis according to capacity, risk priority,
    and system criticality or data sensitivity.
  key_facts:
  - An assessment schedule is created each year to test and monitor controls, assigned to members of the
    Compliance team.
  - Compliance controls are tested at least annually.
  - Risk-based controls are tested by Security-Compliance on a quarterly basis, with frequency also based
    on risk.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/security-assurance/security-compliance/sec-controls/
  - https://handbook.gitlab.com/handbook/security/security-assurance/security-compliance/risk-based-control-testing/
  supporting_quotes:
  - Each year, an assessment schedule is created to test and monitor controls, with assessments grouped
    by quarter and assigned to members of the Compliance team
  - '* **Compliance controls:** Required for external certifications; tested at least annually'
  - While the Security-Compliance will perform risk-based control testing on a quarterly basis, the frequency
    of a particular control’s testing will also be based on risk.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
