- id: G058
  question: How is access removed when an employee leaves?
  domain: IAM
  label: answerable
  reference_answer: We deprovision access upon cessation of employment. For terminated users, we correlate
    current system access listings against a list of active team members derived from Workday using the
    User Access Review tool Lumos. If any users are found to have active system access but are not current
    team members, we open access removal issues to start the de-provisioning process.
  key_facts:
  - Access is deprovisioned upon cessation of employment.
  - System access listings are correlated against active team members from Workday using Lumos.
  - Access removal issues are opened if users have active system access but are not current team members.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/security-and-technology-policies/access-management-policy/
  - https://handbook.gitlab.com/handbook/security/security-assurance/security-compliance/access-reviews/
  supporting_quotes:
  - Access is deprovisioned upon cessation of employment.
  - The current access listings of systems is correlated against a list of active team members derived
    from Workday (GitLab’s source of truth for employment status) using GitLab’s User Access Review tool
    Lumos.
  - If any users are found to have active system access that are not current GitLab team members, open
    access removal issues to start the access de-provisioning process.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
