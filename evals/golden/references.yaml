- id: G007
  question: Do you follow a documented secure software development lifecycle?
  domain: AIS
  label: answerable
  reference_answer: Yes, we outline the general components of our software development lifecycle through
    our Software Development Lifecycle Standard and Software Development Lifecycle Policy. These apply
    to anyone developing, reviewing, and merging code at GitLab in support of our production applications.
  key_facts:
  - We outline the general components of our software development lifecycle in a standard and policy.
  - The standard and policy apply to anyone developing, reviewing, and merging code in support of production
    applications.
