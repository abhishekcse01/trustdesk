  question: Are USB storage devices restricted or required to be encrypted?
  domain: UEM
  label: answerable
  reference_answer: We state that sensitive data should not be stored on removable storage devices, such
    as USB drives or external hard drives. Furthermore, external storage devices on company assets are
    not sanctioned.
