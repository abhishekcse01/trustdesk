- id: G004
  question: Do you map your controls to more than one compliance framework?
  domain: AA
  label: answerable
  reference_answer: Yes, we use a common controls framework called the GitLab Control Framework (GCF)
    where a single control addresses multiple underlying requirements from various compliance frameworks,
    such as SOC2, PCI, and ISO, allowing us to collect evidence for a variety of audits at once.
  key_facts:
  - We developed a common controls framework called the GitLab Control Framework (GCF).
  - A single control addresses multiple underlying requirements to collect evidence for a variety of audits
    at once (such as SOC2, PCI, and ISO).
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/security-assurance/security-compliance/sec-controls/
  supporting_quotes:
  - To address this, we developed a common controls framework called the **GitLab Control Framework (GCF)**.
  - we created a set of security and AI controls that would address multiple underlying requirements with
    a single control allowing the Security Compliance team to make fewer requests to control owners and
    efficiently collect all evidence we would need for a variety of audits at once.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
