- id: G012
  question: Are application security reviews performed for new features with security impact?
  domain: AIS
  label: answerable
  reference_answer: Yes, we ideally provide some threat modeling for all new features, with in-depth code
    review and dynamic testing performed based on the risk profile. These reviews help us proactively
    discover and mitigate vulnerabilities, and if done for new features, we might catch vulnerabilities
    before they make it into a release.
  key_facts:
  - Ideally, all new features would receive some threat modeling.
  - In-depth code review and dynamic testing are performed based on the risk profile.
  - Reviews for new features help catch vulnerabilities before they make it into a release.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/product-security/security-platforms-architecture/application-security/appsec-reviews/
  supporting_quotes:
  - Ideally, all new features would receive some threat modeling, with the latter two stages being performed
    based on the risk profile.
  - if the review is done for new features, we might catch the vulnerabilities even before they make it
    into a release.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
