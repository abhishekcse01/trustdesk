- id: G008
  question: Is code reviewed by someone other than the author before it is merged?
  domain: AIS
  label: answerable
  reference_answer: Yes, code review is the process by which one team member assists another in validating
    that a merge request meets the required standards and goals before merging. Additionally, AppSec reviews
    finalized merge requests.
  key_facts:
  - Code review is the process by which one team member assists another team member in validating a merge
    request.
  - The AppSec team reviews finalized merge requests.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/product-security/vulnerability-management/development-and-code-review/
  - https://handbook.gitlab.com/handbook/security/product-security/security-platforms-architecture/application-security/threat-modeling/howto/
  supporting_quotes:
  - Code review is the process and rules by which one team member is expected to assist another team member
    in validating that a merge request containing code meets not only this standard, but the stated goal
    of the MR and related issues.
  - Second, the AppSec team reviews the finalized merge request.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
