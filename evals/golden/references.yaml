- id: G070
  question: Do you have a security logging standard that defines what must be logged?
  domain: LOG
  label: answerable
  reference_answer: Yes, we maintain a Security Logging Standard that defines requirements for security
    logging, including how security-relevant events must be captured, structured, and retained across
    our product and infrastructure. This standard covers both security logging in our SIEM and requirements
    for systems not sending logs to the SIEM. Additionally, the standard specifies that security logs
    must never contain sensitive data such as passwords, tokens, or private keys, and outlines log format
    and transport requirements.
  key_facts:
  - The GitLab Security Logging Standard defines GitLab’s requirements for security logging.
  - The standard defines how security-relevant events must be captured, structured, and retained across
    GitLab’s product and infrastructure.
