- id: G014
  question: Do you maintain an information system contingency plan for critical systems?
  domain: BCR
  label: answerable
  reference_answer: Yes, we develop contingency plans for GitLab.com and Tier 1 systems to meet the needs
    of critical system operations during a disruption. These procedures are documented in a formal contingency
    plan maintained by the ISCP Coordinator, reviewed and updated annually, and tested yearly for recovery
    capabilities and personnel readiness.
  key_facts:
  - We develop contingency plans for GitLab.com and Tier 1 systems for critical system operations.
  - Procedures are documented in a formal contingency plan by the ISCP Coordinator.
  - The plan is reviewed annually and updated as necessary.
  - The plan recovery capabilities and personnel are tested annually.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/information-system-contingency-plan-iscp/
  supporting_quotes:
  - GitLab will develop contingency plans for GitLab.com and Tier 1 systems to meet the needs of critical
    system operations in the event of a disruption.
  - The procedures for execution of such a capability shall be documented in a formal contingency plan
    by the Information Systems Contingency Plan (ISCP) Coordinator and must be reviewed annually and updated
    as necessary by the ISCP Coordinator.
  - The plan recovery capabilities and personnel shall be tested annually to identify weaknesses of the
    capability.
  drafted_by: gemini/gemini-3.5-flash-lite
  verified: false
  notes: ''
