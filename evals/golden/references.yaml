- id: G065
  question: Do you use a zero trust approach to network access?
  domain: IVS
  label: answerable
  reference_answer: Yes, we are implementing Zero Trust, which is the practice of shifting access control
    from the organization's perimeter to individuals, assets, and endpoints. For us, this means all devices
    trying to access an endpoint or asset within our environment must authenticate and be authorized based
    on dynamic, risk-based decisions.
  key_facts:
  - GitLab is implementing Zero Trust as the practice of shifting access control from the perimeter to
    individuals, assets, and endpoints.
  - Zero Trust means all devices trying to access an endpoint or asset within the environment must authenticate
    and be authorized.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/product-security/security-platforms-architecture/security-architecture/zero-trust/
  supporting_quotes:
  - GitLab is implementing Zero Trust, or the practice of shifting access control from the perimeter of
    the org to the individuals, the assets and the endpoints.
  - In our case, Zero Trust means that all devices trying to access an endpoint or asset within our GitLab
    environment will need to authenticate and be authorized.
