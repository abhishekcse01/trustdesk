- id: G057
  question: Is access granted based on least privilege and job role?
  domain: IAM
  label: answerable
  reference_answer: Yes, we assign role-based access privileges utilizing predefined security groups,
    and administrator access to production systems is granted based on job roles and responsibilities.
    Additionally, our security architecture principles require us to give only the minimum level of access
    rights necessary to complete an assigned operation.
  key_facts:
  - Predefined security groups are utilized to assign role-based access privileges.
  - Administrator access to the production systems is granted based on job roles and responsibilities.
  - We give only the minimum level of access rights that is necessary to a user or service to complete
    an assigned operation.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/security-assurance/technical-and-organizational-measures/
  - https://handbook.gitlab.com/handbook/security/product-security/security-platforms-architecture/security-architecture/
  supporting_quotes:
  - Predefined security groups are utilized to assign role-based access privileges and segregate access
    to data to the production systems.
  - Administrator access to the production systems is granted based on job roles and responsibilities
