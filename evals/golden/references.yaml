- id: G010
  question: Do developers receive secure coding training?
  domain: AIS
  label: answerable
  reference_answer: Yes, we prioritize secure coding training for our developers and other team members
    who write code. The Secure Coding Training is a required training completed by a sub-group of team
    members and contractors in the Engineering Department, as well as active team members and contractors
    across other departments whose roles include writing code.
  key_facts:
  - Training of our developers is a high priority item.
  - The GitLab Secure Coding Training is a required training completed by a sub-group of GitLab Team Members
    and contractors/TSPs in the Engineering Department.
  - A Secure Coding training module must also be completed by 100% of all active GitLab team members +
    contractors/TSPs who write code as part of their role.
  supporting_urls:
  - https://handbook.gitlab.com/handbook/security/security-assurance/governance/security-training/
  - https://handbook.gitlab.com/handbook/security/security-assurance/governance/sec-training/
  - https://handbook.gitlab.com/handbook/security/security-assurance/governance/sec-awareness-training/
  supporting_quotes:
  - training of our developers is a high priority item
  - The GitLab Secure Coding Training is a required training completed by a sub-group of GitLab Team Members
    and contractors/TSPs in the Engineering Department.
  - additional Secure Coding training module must also be completed by 100% of all active GitLab team
    members + contractors/TSPs.
